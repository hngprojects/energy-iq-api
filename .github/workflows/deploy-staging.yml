name: Deploy to Staging

on:
  workflow_run:
    workflows:
      - "CI Quality & Security Gate"
    types: [completed]
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10"

concurrency:
  group: deploy-staging-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Staging Server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
      
      - name: Create Deployment Archive
        id: archive
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          FILENAME="${SHA:0:12}.tar.gz"
          echo "filename=${FILENAME}" >> "$GITHUB_OUTPUT"
          tar \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.github' \
          --exclude='*.tar.gz' \
          -czf "/tmp/${FILENAME}" .
          mv /tmp/"${FILENAME}" .

      - name: Copy Archive to Server
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "${{ steps.archive.outputs.filename }}"
          target: /tmp

      - name: Deploy to Server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          ARCHIVE: ${{ steps.archive.outputs.filename }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: ARCHIVE
          script: |
            set -euo pipefail
            APP_DIR=/home/${{ secrets.SSH_USER }}/backend/staging
            DEPLOY_DIR="$APP_DIR/releases/${ARCHIVE%.tar.gz}"
            mkdir -p "$DEPLOY_DIR"
            tar -xzf /tmp/"${ARCHIVE}" -C "${DEPLOY_DIR}"

            # Capture previous release before any changes
            PREV=$(readlink -f "$APP_DIR/current")
            echo "$PREV" > "$APP_DIR/.prev_release"

            cd "$DEPLOY_DIR"
            pnpm install --frozen-lockfile
            ln -sfn "$APP_DIR/shared/.env" "$DEPLOY_DIR/.env"

            # Count migrations before applying new ones
            BEFORE=$(pnpm migration:show 2>/dev/null | awk '/^\[X\]/{count++} END { print count + 0 }')

            # Run migrations from new release before symlink swap
            pnpm migration:run

            # Count how many were applied, store for rollback
            AFTER=$(pnpm migration:show 2>/dev/null | awk '/^\[X\]/{count++} END { print count + 0 }')
            APPLIED=$(( AFTER - BEFORE ))
            echo "$APPLIED" > "$APP_DIR/.migrations_applied"

            # Point traffic to the new release
            ln -sfn "$DEPLOY_DIR" "$APP_DIR/current"

            cat > "$DEPLOY_DIR/ecosystem.config.js" <<EOF
            module.exports = {
              apps: [{
                name: 'be-staging',
                script: '$DEPLOY_DIR/dist/main.js',
                cwd: '$DEPLOY_DIR',
              }]
            }
            EOF

            pm2 reload "$DEPLOY_DIR/ecosystem.config.js" --update-env \
              || pm2 start "$DEPLOY_DIR/ecosystem.config.js"
            pm2 save

            # keep last 3 releases, clean the rest
            ls -dt "$APP_DIR/releases"/*/  | tail -n +4 | xargs rm -rf

            echo "==> Cleaning up..."
            rm -f /tmp/"${ARCHIVE}"
            echo "Staging deploy complete"          

      - name: Health check
        id: healthcheck
        run: |
          echo "Waiting for staging service to be ready..."
          for i in $(seq 1 5); do
            RESPONSE=$(curl --silent --max-time 10 --write-out "\n%{http_code}" \
                "${{ secrets.STAGING_HEALTH_URL }}")
            STATUS_CODE=$(echo "$RESPONSE" | tail -n 1)
            BODY=$(echo "$RESPONSE" | head -n -1)
            if [ "$STATUS_CODE" -ne 200 ]; then
              echo "Attempt $i/5 — HTTP $STATUS_CODE"
              echo "$BODY"
              sleep 15
              continue
            fi
            if [ "$(echo "$BODY" | jq -r '.data.status')" != 'ok' ]; then
              echo "Attempt $i/5 — app unhealthy"
              echo "$BODY"
              sleep 10
              continue
            fi
            echo "Health check passed."
            exit 0
          done
          
          echo "Health check failed after 5 attempts."
          exit 1

      - name: Rollback on failure
        if: ${{ failure() && steps.healthcheck.outcome == 'failure' }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            APP_DIR=/home/${{ secrets.SSH_USER }}/backend/staging

            # Revert exactly the migrations this deploy applied
            APPLIED=$(cat "$APP_DIR/.migrations_applied" 2>/dev/null || echo 0)
            if [ "$APPLIED" -gt 0 ]; then
              cd "$APP_DIR/current"
              for i in $(seq 1 "$APPLIED"); do
                pnpm migration:revert
              done
            fi

            PREV=$(cat "$APP_DIR/.prev_release" 2>/dev/null)
            if [ -z "$PREV" ] || [ ! -d "$PREV" ]; then
              echo "No valid previous release found, cannot rollback"
              exit 1
            fi
            ln -sfn "$PREV" "$APP_DIR/current"
            
            pm2 reload be-staging --update-env