name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    name: Require CI Pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm CI workflow passed
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
              event: 'push',
              status: 'success',
              per_page: 5,
            });
            const passed = runs.data.workflow_runs.some(
              r => r.head_sha === context.sha && r.name === 'CI Quality & Security Gate'
            );
            if (!passed) core.setFailed('CI Quality & Security Gate has not passed for this commit.');

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gate
    environment:
      name: production
      url: https://api.energy-iq.hng14.com/api/v1/health

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Deploy via SSH
        uses: appleboy/ssh-action@2afe43f7b62e2c02e5e5bc5de3c4059bc81f5fe0
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e                    
            
            cd /home/appuser/backend/production

            git pull origin main

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            pnpm install --frozen-lockfile
            pnpm migration:run
            pnpm build

            pm2 reload be-prod --update-env || pm2 start dist/main.js --name be-prod
            pm2 save
            

      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          for i in $(seq 1 12); do
            if curl --silent --fail --max-time 10 \
                https://api.energy-iq.hng14.com/api/v1/health; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i/12 failed — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 2 minutes."
          exit 1
