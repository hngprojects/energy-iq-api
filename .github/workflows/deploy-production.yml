name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gate:
    name: Require CI Pass
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm CI workflow passed for this commit
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const maxAttempts = 20;
            const delayMs = 30000;
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              console.log(`Checking CI status (Attempt ${attempt}/${maxAttempts})...`);
              
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: 'staging',
                event: 'push',
                per_page: 20, 
              });

              const targetRun = runs.data.workflow_runs.find(
                r => r.head_sha === context.sha && r.name === 'CI Quality & Security Gate'
              );

              if (targetRun) {
                if (targetRun.status === 'completed') {
                  if (targetRun.conclusion === 'success') {
                    console.log('CI Quality & Security Gate passed successfully!');
                    return;
                  } else {
                    core.setFailed(`CI Quality & Security Gate finished with conclusion: ${targetRun.conclusion}`);
                    return;
                  }
                } else {
                  console.log(`CI run is currently: ${targetRun.status}. Waiting...`);
                }
              } else {
                console.log('CI workflow run not detected yet. Waiting for it to trigger...');
              }

              if (attempt < maxAttempts) {
                await sleep(delayMs);
              }
            }

            core.setFailed('Timed out waiting for CI Quality & Security Gate to complete.');

  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gate
    environment:
      name: production
      url: https://api.energy-iq.hng14.com/api/v1/health

    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.PROD_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e                    
            
            cd /home/appuser/backend/production

            git pull origin main

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            pnpm install --frozen-lockfile
            pnpm migration:run
            pnpm build

            pm2 reload be-prod --update-env || pm2 start dist/main.js --name be-prod
            pm2 save
            

      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          for i in $(seq 1 12); do
            if curl --silent --fail --max-time 10 \
                https://api.energy-iq.hng14.com/api/v1/health; then
              echo "Health check passed."
              exit 0
            fi
            echo "Attempt $i/12 failed — retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 2 minutes."
          exit 1
